# fly.toml — Suri deployment config.
#
# Notes:
#   - [http_service] exposes the public surface on https://<app>.fly.dev:
#     OAuth callbacks (Outlook magic-link), Plaid webhooks + hosted Link
#     pages, /healthz, and (added in step 4 of the iOS plan) /api/v1/*
#     for the iOS app.
#   - Single machine, no auto-stop: in-flight OAuth flows + Plaid Link
#     sessions live in SQLite on the local /data volume — a second machine
#     wouldn't see them. APScheduler also runs in-process; multiple
#     machines would fire each cron N times. Stay 1-of-1 until v0.1.
#   - 1GB RAM: Chromium (used for unsubscribe pages) needs the headroom.
#   - Volume at /data: SQLite db + outlook_token.json persist across deploys.
#
# App name is set on `fly launch`; you can rename later via `fly apps rename`.
app = "suri"
primary_region = "sjc"  # San Jose — closest US west coast region to PT

[build]
  dockerfile = "Dockerfile"

[env]
  SURI_HEADLESS = "1"
  SURI_DATA_DIR = "/data"
  TZ = "America/Los_Angeles"
  PORT = "8080"
  # Public URL Suri uses to build OAuth magic links. Must match the redirect
  # URI registered in the Azure app: <SURI_PUBLIC_URL>/connect/outlook/callback
  SURI_PUBLIC_URL = "https://suri.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # auto_stop disabled: APScheduler runs in-process and we don't want crons
  # silently dropped. Also keeps the Outlook token cache + any pending OAuth
  # state warm between requests.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "suri_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "immediate"  # don't try rolling — there's only one machine
